<svg id="research-animation" class="research-animation" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="research-animation-title research-animation-desc">
<title id="research-animation-title">$visual_title</title>
<desc id="research-animation-desc">$hero_alt</desc>
<defs>
  <radialGradient id="research-glow"><stop stop-color="#72d9c1" stop-opacity=".14"/><stop offset="1" stop-color="#72d9c1" stop-opacity="0"/></radialGradient>
  <linearGradient id="research-cell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#417f81"/><stop offset="1" stop-color="#1b424f"/></linearGradient>
  <linearGradient id="research-dna" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#79d9bc"/><stop offset=".5" stop-color="#c3ebe2"/><stop offset="1" stop-color="#67a9c8"/></linearGradient>
  <pattern id="research-dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#a9d8d0" opacity=".15"/></pattern>
</defs>
<rect width="560" height="360" fill="url(#research-dots)"/>
<ellipse cx="274" cy="177" rx="275" ry="167" fill="url(#research-glow)"/>
<g class="visual-stage-labels" fill="#c6e3dc" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.3">
  <text x="31" y="30"><tspan fill="#73c5b4">01</tspan> $visual_sequence</text>
  <text x="218" y="30"><tspan fill="#73c5b4">02</tspan> $visual_context</text>
  <text x="408" y="30"><tspan fill="#e8c995">03</tspan> $visual_evidence</text>
</g>
<!-- Routes show the proposed comparison, not measured activity or time-series data. -->
<g class="signal-paths" fill="none" stroke-linecap="round">
  <g stroke="#75b7b0" stroke-width="1" opacity=".35">
    <path d="M174 171C209 171 213 88 250 88"/><path d="M174 171H250"/><path d="M174 171C209 171 213 254 250 254"/>
    <path d="M314 88C369 88 387 171 425 171"/><path d="M314 171H425"/><path d="M314 254C369 254 387 171 425 171"/>
  </g>
  <g class="signal-flow" stroke="#9cebd4" stroke-width="2.4" stroke-dasharray="5 95">
    <path pathLength="100" d="M174 171C209 171 213 88 250 88"/><path pathLength="100" d="M174 171H250"/><path pathLength="100" d="M174 171C209 171 213 254 250 254"/>
  </g>
  <g class="signal-flow signal-flow-later" stroke="#e7c991" stroke-width="2.4" stroke-dasharray="5 95">
    <path pathLength="100" d="M314 88C369 88 387 171 425 171"/><path pathLength="100" d="M314 171H425"/><path pathLength="100" d="M314 254C369 254 387 171 425 171"/>
  </g>
</g>
<g transform="translate(101 171)">
  <circle r="75" fill="none" stroke="#83c7c0" stroke-opacity=".16"/>
  <circle r="64" fill="#153c45" fill-opacity=".65" stroke="#7dc7b8" stroke-opacity=".3"/>
  <g class="dna-orbit"><ellipse rx="78" ry="39" transform="rotate(-34)" fill="none" stroke="#83c7c0" stroke-opacity=".42"/><circle cx="64.7" cy="-43.6" r="3.4" fill="#b9eddc"/><circle cx="-64.7" cy="43.6" r="2.2" fill="#83c1d9"/></g>
  <g class="dna-float" fill="none" stroke-linecap="round">
    <g stroke="url(#research-dna)" stroke-width="2.2" opacity=".72">
      <path d="M-2-63H2M-14-52H14M-23-41H23M-24-30H24M-16-19H16M-3-8H3M10 3H-10M21 14H-21M25 25H-25M19 36H-19M7 47H-7M-7 58H7"/>
    </g>
    <path d="M0-66C-33-41-33-21 0 0S33 41 0 66" stroke="#7edec0" stroke-width="4.5"/>
    <path d="M0-66C33-41 33-21 0 0S-33 41 0 66" stroke="#a3cedf" stroke-width="4.5"/>
    <path class="dna-highlight" pathLength="100" d="M0-66C-33-41-33-21 0 0S33 41 0 66" stroke="#e4fff4" stroke-width="4.5" stroke-dasharray="9 91"/>
  </g>
</g>
<g class="context-cells" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#e5f4ee">
  <g transform="translate(282 88)"><g class="cell-breathe"><ellipse rx="31" ry="26" fill="url(#research-cell)" stroke="#93d6c7" stroke-width="1.2"/><ellipse cx="-3" cy="-2" rx="12" ry="9" fill="#9dd2c1"/><path d="M-19 11q7 6 13 2M14-14l5 7" stroke="#8ed1bf" stroke-width="2" fill="none"/></g><text y="46">HepG2</text></g>
  <g transform="translate(282 171)"><g class="cell-breathe"><circle r="27" fill="url(#research-cell)" stroke="#93d6c7" stroke-width="1.2"/><path d="M-12-7C-15-21 18-15 11-1S-9 13-12-7" fill="#9dd2c1"/><path d="M-17 11q7 7 12 3" stroke="#8ed1bf" stroke-width="2" fill="none"/></g><text y="46">K562</text></g>
  <g transform="translate(282 254)"><g class="cell-breathe"><path d="M-21-20L1-29 25-14 29 10 5 27-23 17-29-4Z" fill="url(#research-cell)" stroke="#93d6c7" stroke-width="1.2"/><circle cx="-1" cy="-1" r="11" fill="#9dd2c1"/></g><text y="46">WTC11</text></g>
</g>
<g transform="translate(474 171)">
  <circle r="47" fill="#254c51" stroke="#bbccae" stroke-opacity=".3"/>
  <circle class="evidence-ring" r="47" fill="none" stroke="#e3c898" stroke-width="1.4" stroke-dasharray="36 259" transform="rotate(-90)"/>
  <g class="evidence-pages" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-18-24H14L24-14V26H-18Z" transform="rotate(9)" fill="#21434b" stroke="#6d9e9d"/>
    <path d="M-24-29H9L20-18V21H-24Z" fill="#335961" stroke="#d2e7d8" stroke-width="1.3"/>
    <path d="M9-29V-18H20" fill="none" stroke="#d2e7d8"/>
    <g fill="none" stroke="#d4e9df" stroke-width="1.5"><path d="M-15-14H1M-15-6H7M-15 2H0M-15 10H-5"/></g>
    <circle cx="16" cy="18" r="13" fill="#e3c898"/>
    <path d="M10 18l4 4 8-9" fill="none" stroke="#234b4c" stroke-width="2.2"/>
  </g>
</g>
<path d="M34 322H526" fill="none" stroke="#91c6bd" stroke-opacity=".2"/>
<text x="280" y="346" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#bbd8d1">$visual_sources</text>
</svg>
