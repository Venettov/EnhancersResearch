<style>.software-flowchart text{font-family:Arial,Helvetica,sans-serif;fill:#183d46}.software-flowchart .sf-title{font-size:29px;font-weight:700}.software-flowchart .sf-node-title{font-size:25px;font-weight:700}.software-flowchart .sf-code{font-family:monospace;font-size:24px;font-weight:700}.software-flowchart .sf-line{font-size:23px}.software-flowchart .sf-small{font-size:18px;fill:#526b70}.software-flowchart .sf-label{font-size:21px;font-weight:700}.software-flowchart a:hover text{text-decoration:underline}</style>
<title id="sf-title">Nuestro software iEnhancer-2L: preparación, evaluación por grupos, ajuste final y predicción en dos etapas</title>
<desc id="sf-desc">Se comprueban las secuencias originales y etiquetas S1. Las propiedades S2 y comprobaciones hg19 generan 4105 características y 2451 grupos de secuencias relacionadas. La evaluación anidada mantiene juntos los grupos. Una búsqueda separada solo con entrenamiento ajusta dos modelos finales. Para una nueva secuencia de 200 bases, la etapa I predice potenciador o no potenciador. Solo los potenciadores predichos pasan a la etapa II, que predice fuerte o débil. Todas las rutas generan un registro CSV.</desc>
<rect x="0" y="0" width="1440" height="1600" rx="0" fill="#f7f7f1" stroke="#f7f7f1" stroke-width="2"/>
<rect x="28" y="24" width="1384" height="82" rx="16" fill="#e5f0eb" stroke="#cedcd8" stroke-width="2"/>
<text x="52" y="58" class="sf-line" text-anchor="start">Python + .venv ejecutan el código · Git/GitHub conservan entradas, versiones y evidencia</text>
<text x="52" y="87" class="sf-small" text-anchor="start">VS Code es un editor y terminal opcional; no proporciona el método de predicción.</text>
<rect x="28" y="128" width="1384" height="586" rx="16" fill="#fff" stroke="#cedcd8" stroke-width="2"/>
<text x="52" y="172" class="sf-title" text-anchor="start">1. Preparar, entrenar y evaluar la reconstrucción</text>
