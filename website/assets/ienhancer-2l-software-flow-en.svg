<text x="782" y="234" class="sf-code" text-anchor="start">build_features.py</text>
</a>
<text x="782" y="268" class="sf-line" text-anchor="start">S2 properties + verified hg19 receipts</text>
<text x="782" y="297" class="sf-line" text-anchor="start">NumPy + RapidFuzz: 2,451 sequence groups</text>
<text x="782" y="326" class="sf-line" text-anchor="start">Fixed folds + 4,105 PseKNC features per sequence</text>
</g>
<g data-sf-node="evaluation">
<rect x="60" y="392" width="610" height="152" rx="16" fill="#edf5f1" stroke="#cedcd8" stroke-width="2"/>
<a href="https://github.com/Venettov/EnhancersResearch/blob/main/replication/ienhancer_2l/train_svm.py" target="_blank" rel="noopener noreferrer">
<text x="82" y="428" class="sf-code" text-anchor="start">train_svm.py</text>
</a>
<text x="82" y="462" class="sf-line" text-anchor="start">Grouped evaluation · scikit-learn/LIBSVM + SciPy</text>
<text x="82" y="491" class="sf-line" text-anchor="start">5 outer folds test; 3 inner folds select settings</text>
<text x="82" y="520" class="sf-line" text-anchor="start">Related sequences stay together</text>
</g>
<g data-sf-node="final-fit">
<rect x="730" y="392" width="650" height="152" rx="16" fill="#edf5f1" stroke="#cedcd8" stroke-width="2"/>
<a href="https://github.com/Venettov/EnhancersResearch/blob/main/replication/ienhancer_2l/train_svm.py" target="_blank" rel="noopener noreferrer">
<text x="752" y="428" class="sf-code" text-anchor="start">train_svm.py</text>
</a>
<text x="752" y="462" class="sf-line" text-anchor="start">Final fit after a training-only five-fold search</text>
<text x="752" y="491" class="sf-line" text-anchor="start">Layer I: 2,968; layer II: 1,484 known enhancers</text>
<text x="752" y="520" class="sf-line" text-anchor="start">Fit each final model on all its training records</text>
</g>
<g data-sf-node="evaluation-output">
