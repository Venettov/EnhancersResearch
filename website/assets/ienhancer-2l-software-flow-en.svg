<text x="82" y="234" class="sf-node-title" text-anchor="start">Original inputs</text>
<text x="82" y="268" class="sf-line" text-anchor="start">FASTA · 200 bases</text>
<text x="82" y="297" class="sf-line" text-anchor="start">S1 class labels</text>
</g>
<g data-sf-node="prepare">
<rect x="430" y="198" width="290" height="130" rx="16" fill="#edf5f1" stroke="#cedcd8" stroke-width="2"/>
<a href="https://github.com/Venettov/EnhancersResearch/blob/main/replication/ienhancer_2l/prepare_data.py" target="_blank" rel="noopener noreferrer">
