<style>.software-flowchart text{font-family:Arial,Helvetica,sans-serif;fill:#183d46}.software-flowchart .sf-title{font-size:29px;font-weight:700}.software-flowchart .sf-node-title{font-size:25px;font-weight:700}.software-flowchart .sf-code{font-family:monospace;font-size:24px;font-weight:700}.software-flowchart .sf-line{font-size:23px}.software-flowchart .sf-small{font-size:18px;fill:#526b70}.software-flowchart .sf-label{font-size:21px;font-weight:700}.software-flowchart a:hover text{text-decoration:underline}</style>
<title id="sf-title">Our iEnhancer-2L software: data preparation, grouped evaluation, final fitting, and two-stage prediction</title>
<desc id="sf-desc">Original sequences and S1 labels are checked. S2 properties and verified hg19 receipts yield 4105 features and 2451 related-sequence groups. Nested evaluation keeps groups together. A separate training-only search fits two final models. For a new 200-base sequence, layer I predicts enhancer or non-enhancer. Only predicted enhancers reach layer II, which predicts strong or weak. All routes produce a CSV record.</desc>
<rect x="0" y="0" width="1440" height="1600" rx="0" fill="#f7f7f1" stroke="#f7f7f1" stroke-width="2"/>
<rect x="28" y="24" width="1384" height="82" rx="16" fill="#e5f0eb" stroke="#cedcd8" stroke-width="2"/>
<text x="52" y="58" class="sf-line" text-anchor="start">Python + .venv run the code · Git/GitHub preserve inputs, code versions, and evidence</text>
<text x="52" y="87" class="sf-small" text-anchor="start">VS Code is an optional editor and terminal; it does not supply the prediction method.</text>
<rect x="28" y="128" width="1384" height="586" rx="16" fill="#fff" stroke="#cedcd8" stroke-width="2"/>
<text x="52" y="172" class="sf-title" text-anchor="start">1. Prepare, train, and evaluate the reconstruction</text>
<rect x="28" y="744" width="1384" height="790" rx="16" fill="#fff" stroke="#cedcd8" stroke-width="2"/>
<text x="52" y="788" class="sf-title" text-anchor="start">2. Apply the saved models to new DNA</text>
