<text x="452" y="896" class="sf-line" text-anchor="start">Same feature calculations</text>
<text x="452" y="925" class="sf-line" text-anchor="start">A feature vector for each layer</text>
</g>
<g data-sf-node="layer1">
<rect x="850" y="826" width="530" height="130" rx="16" fill="#e3f0eb" stroke="#cedcd8" stroke-width="2"/>
