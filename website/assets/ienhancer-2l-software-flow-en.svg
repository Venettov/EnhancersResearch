<text x="872" y="896" class="sf-line" text-anchor="start">Saved RBF SVM · weight w = 0.1</text>
<text x="872" y="925" class="sf-line" text-anchor="start">Score &gt; 0 continues to layer II</text>
</g>
<text x="846" y="991" class="sf-label" text-anchor="start">Yes (&gt; 0)</text>
<text x="1250" y="999" class="sf-label" text-anchor="start">No (≤ 0)</text>
