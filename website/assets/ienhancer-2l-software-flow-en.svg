<text x="752" y="602" class="sf-node-title" text-anchor="start">Two saved final models (.npz)</text>
</g>
<text x="60" y="674" class="sf-small" text-anchor="start">Historical 400-record test: diagnostic only; 100 training duplicates. Excluded from evaluation.</text>
<text x="60" y="701" class="sf-small" text-anchor="start">No NEW_2026_DATA activity measurements are used in fitting.</text>
<text x="1078" y="734" class="sf-small" text-anchor="start">Saved models</text>
