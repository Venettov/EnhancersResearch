name: Website checks
on:
  pull_request:
    paths: ['website/**', 'docs/**', 'replication/**', '.github/workflows/site-checks.yml', '.github/workflows/pages.yml']
  push:
    branches: [main]
    paths: ['website/**', 'docs/**', 'replication/**', '.github/workflows/site-checks.yml', '.github/workflows/pages.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python website/build.py
      - run: python website/tests/check_site.py
      - run: python -m pip install -r replication/ienhancer_2l/requirements.txt
      - run: python -m unittest discover -s replication/ienhancer_2l -p 'test_*.py'
      - name: Check generated site is current
        run: git diff --exit-code -- docs
